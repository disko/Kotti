name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-sqlite:
    name: Test (Python ${{ matrix.python-version }} / sqlite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project
        run: uv sync --locked --group test

      - name: Run tests
        run: uv run pytest

  test-postgres:
    name: Test (Python ${{ matrix.python-version }} / postgres)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project
        run: uv sync --locked --group test

      - name: Install psycopg2-binary
        run: uv pip install psycopg2-binary

      - name: Run tests
        run: uv run pytest
        env:
          KOTTI_TEST_DB_STRING: postgresql://postgres:postgres@localhost:5432/postgres

  test-mysql:
    name: Test (Python ${{ matrix.python-version }} / mysql)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    services:
      mysql:
        image: mariadb:latest
        env:
          MYSQL_USER: kotti
          MYSQL_PASSWORD: kotti
          MYSQL_DATABASE: kotti
          MYSQL_ROOT_PASSWORD: kotti
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project
        run: uv sync --locked --group test

      - name: Install PyMySQL
        run: uv pip install pymysql

      - name: Run tests
        run: uv run pytest
        env:
          KOTTI_TEST_DB_STRING: mysql+pymysql://kotti:kotti@127.0.0.1:3306/kotti

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --group test

      - name: Run ruff check
        run: uv run ruff check .
