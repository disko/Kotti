# Kotti Documentation — mkdocs.yml
# Material for MkDocs + Kotti Amber Heritage brand skin

site_name: Kotti
site_description: Pythonic web framework + CMS built on Pyramid & SQLAlchemy
site_url: https://kotti.readthedocs.io/  # update as needed
repo_url: https://github.com/Kotti/Kotti
repo_name: Kotti/Kotti

theme:
  name: material
  custom_dir: docs/overrides
  language: en

  # Logo & favicon
  logo: assets/kotti-mark-dark.svg       # amber mark on dark header
  favicon: assets/kotti-favicon.svg

  # Color scheme — toggle between light/dark
  palette:
    - scheme: default
      primary: custom     # we override via CSS
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  # JetBrains Mono everywhere
  font:
    text: JetBrains Mono
    code: JetBrains Mono

  # Material features
  features:
    - navigation.instant       # SPA-style navigation
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs          # top-level tabs in header
    - navigation.sections      # render sections as groups
    - navigation.expand        # auto-expand nav sections
    - navigation.top           # back-to-top button
    - navigation.footer        # prev/next in footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy        # copy button on code blocks
    - content.code.annotate    # code annotations
    - content.tabs.link        # linked content tabs
    - toc.follow

  # Custom icon overrides (optional)
  icon:
    repo: fontawesome/brands/github

# Brand CSS
extra_css:
  - stylesheets/kotti.css

# Plugins
plugins:
  - search
  # - social                    # uncomment for auto social cards
  # - tags                      # uncomment for tag support
  # - blog                      # uncomment for blog
  # Versioning: use mike for multi-version docs
  # pip install mike

# Markdown extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Extra
extra:
  # Social links in footer
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Kotti/Kotti
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/Kotti/

  # Version selector (requires mike)
  # version:
  #   provider: mike

